---
- name: "Automate AMQ Streams KRaft install"
  hosts: all
  vars:
    # Simulate a deployment made with collection <= 1.0.4, whose default data dir was
    # inside the versioned Kafka home. Converge only: side_effect uses the role default,
    # so the run there has to migrate the data.
    amq_streams_kraft_data_dir: "{{ amq_streams_kafka_home }}/data/kraft"
    migration_topic: migrationTopic
    migration_message_count: 100
    # Topic Management
    amq_streams_broker_topics:
      - name: sampleTopic
        partitions: 2
        replication_factor: 1
      - name: otherTopic
        partitions: 4
        replication_factor: 1
  vars_files:
    - vars.yml
  roles:
    - role: amq_streams_common
    - role: amq_streams_kraft
  tasks:
    - name: "Validate that KRaft deployment is functional."
      ansible.builtin.include_role:
        name: amq_streams_kraft
        tasks_from: validate.yml

    - name: "Ensure AMQ Streams Connect is running and available."
      ansible.builtin.include_role:
        name: amq_streams_connect
      vars:
        amq_streams_common_skip_download: true
        connectors:
          - { name: "file", path: "connectors/file.yml" }

    - name: "Validate that Connect deployment is functional."
      ansible.builtin.include_role:
        name: amq_streams_connect
        tasks_from: validate.yml

  post_tasks:
    - name: "Ensures topics exist."
      ansible.builtin.include_role:
        name: amq_streams_broker
        tasks_from: topic/create.yml
      loop: "{{ amq_streams_broker_topics }}"
      loop_control:
        loop_var: topic
      vars:
        topic_name: "{{ topic.name }}"
        topic_partitions: "{{ topic.partitions }}"
        topic_replication_factor: "{{ topic.replication_factor }}"

    - name: "Describe created topics."
      ansible.builtin.include_role:
        name: amq_streams_broker
        tasks_from: topic/describe.yml
      loop: "{{ amq_streams_broker_topics }}"
      loop_control:
        loop_var: topic
      vars:
        topic_name: "{{ topic.name }}"

    - name: "Delete topics"
      ansible.builtin.include_role:
        name: amq_streams_broker
        tasks_from: topic/delete.yml
      loop: "{{ amq_streams_broker_topics }}"
      loop_control:
        loop_var: topic
      vars:
        topic_name: "{{ topic.name }}"

    - name: "Create topic that must survive the data dir migration: {{ migration_topic }}"
      ansible.builtin.command: >-
        {{ amq_streams_kafka_home }}/bin/kafka-topics.sh --bootstrap-server localhost:9092
        --create --if-not-exists --topic {{ migration_topic }} --partitions 1 --replication-factor 1
      changed_when: false

    - name: "Read current message count of {{ migration_topic }}"
      ansible.builtin.command: >-
        {{ amq_streams_kafka_home }}/bin/kafka-get-offsets.sh --bootstrap-server localhost:9092
        --topic {{ migration_topic }}
      register: __migration_offsets
      changed_when: false

    - name: "Produce {{ migration_message_count }} messages (only once, keeps idempotence)"
      ansible.builtin.shell: >-
        set -o pipefail &&
        seq 1 {{ migration_message_count }} | sed 's/^/msg-/' |
        {{ amq_streams_kafka_home }}/bin/kafka-console-producer.sh
        --bootstrap-server localhost:9092 --topic {{ migration_topic }}
      args:
        executable: /bin/bash
      changed_when: false
      when: __migration_offsets.stdout is search(migration_topic ~ ':0:0$')

    - name: "Record the cluster ID before migration"
      ansible.builtin.shell: >-
        grep -h '^cluster.id=' {{ amq_streams_kraft_data_dir }}/meta.properties | cut -d= -f2 > /root/original_cluster_id
      changed_when: false
